# =============================================================================
# Enterprise Agent — Python 工程配置
# 统一承载 ruff( lint/format ) 与 pytest( 测试/覆盖率 ) 配置，
# 让 `make lint` / `make test` / CI 读取同一份真相，避免配置漂移。
# =============================================================================

[project]
# 版本基准：部署（Dockerfile 四个镜像）与 CI 均锁定 Python 3.11；
# 本地开发建议 3.11，与部署 / CI 完全一致，从源头消除「本地绿 CI 红」。
# 代码已通过 `from __future__ import annotations` 兼容 3.11 的注解即时求值语义。
name = "enterprise-agent"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
# 行宽对齐 black 默认值，团队统一
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# 选型说明（资深开发把关）：
#   E/F  : pycodestyle + pyflakes，基础正确性（必开）
#   I    : isort，import 顺序，review 时减少噪音
#   B    : bugbear，捕捉常见 bug（如可变默认参数、宽 except）
#   C4   : flake8-comprehensions，更优写法
#   UP   : pyupgrade，自动提示新语法
#   SIM  : flake8-simplify，简化冗长写法
#   ASYNC: 异步用法正确性（本项目大量 asyncio）
#   S    : bandit 规则子集，安全敏感（密钥/SQL 拼接等）
#   PERF : 性能反模式
select = ["E", "F", "I", "B", "C4", "UP", "SIM", "ASYNC", "S", "PERF"]
ignore = [
    "S101",   # 测试中允许 assert
    "B008",   # FastAPI 依赖注入 decorators 误报
    "S105",   # 硬编码密码常量（测试/示例场景）
]

[tool.ruff.lint.per-file-ignores]
# 测试目录：放宽部分规则，专注可读性
"tests/**" = ["S", "B"]
# 迁移/脚本：允许 print 与宽泛写法
"scripts/**" = ["T201", "B"]

[tool.ruff.lint.flake8-bugbear]
# 禁止可变默认参数（最常见的"看起来能用实则埋雷"）
extend-immutable-calls = ["fastapi.params.Depends", "pydantic.Field"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.pytest.ini_options]
# 关键：把覆盖率门槛固化进 pytest，本地 `make test` 与 CI 行为一致
addopts = [
    "-q",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml",
    # 失败门槛：实测 CI 裸环境（无 Key、无 .env、requires_llm 自动跳过）覆盖率
    # 约 48%（828 passed / 17 skipped）。取 40 作为基线，预留环境波动余量；
    # 测试逐步补全后再上调。CI 用同样的 --cov-fail-under，本地 make test 与 CI 一致。
    "--cov-fail-under=40",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# 本项目 async 测试较多，自动识别 async 测试，避免漏标 @pytest.mark.asyncio
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "integration: 真实 LLM/外部依赖端到端测试；默认跳过，需 RUN_INTEGRATION_TESTS=1 且配置 API Key 才运行",
    "requires_llm: 需要真实 LLM / Embedding API Key 才能运行；默认跳过，需设置 RUN_LLM_TESTS=1 且配置 API Key 才运行（见 tests/conftest.py）",
]
# 说明：此处曾有一份 collect_ignore 清单，屏蔽 test_api/test_graph/test_websocket 等九个目录。
# 但 collect_ignore 并不是 pytest 的 ini 选项（仅在 conftest.py 中作为模块级变量生效），
# 该配置从未真正起作用，pytest 每次运行都会以 "Unknown config option" 告警。
# 2026-08-08 逐目录体检并修复后，全部目录可正常运行，清单已删除，测试范围回归 testpaths。

[tool.coverage.run]
branch = true
omit = [
    "src/protocols/*",   # 协议适配层接入点，单独覆盖
    "src/seed.py",
    "*/__init__.py",
]

[tool.coverage.report]
# 显式声明目标，配合 --cov-fail-under 作为单一真相
fail_under = 40
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
]
