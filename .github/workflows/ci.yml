name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  python-test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests with coverage
        run: |
          # GitHub 公开仓库无 API Key，只跑确定性测试（FakeLLM / mock）。
          # 采用"白名单"策略：只列确定能跑的目录，避免有问题的 conftest.py
          # 在 import 阶段就崩掉（exit code 4）。
          # 已验证以下目录无危险导入：
          #   test_agent     → FakeLLM 注入式测试 ✅
          #   test_evaluation→ 纯计算评分测试 ✅
          #   test_mcp_tools  → MCP 工具测试 ✅
          #   test_safety     → 安全检查测试 ✅
          #   test_ticket     → 工单测试 ✅
          pytest \
            tests/test_agent/ \
            tests/test_evaluation/ \
            tests/test_mcp_tools/ \
            tests/test_safety/ \
            tests/test_ticket/ \
            -v --cov=src --cov-report=term --cov-report=xml \
            -m "not integration" \
            --cov-fail-under=0 \
            -W "ignore::DeprecationWarning"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  python-security:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SAST tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep

      - name: Bandit (medium+, blocking)
        run: |
          # 中高危漏洞阻断合并；已知安全项已在 bandit.yaml 中说明
          bandit -c bandit.yaml -r src/ --severity-level medium -f txt

      - name: Semgrep (ERROR, advisory on GitHub)
        run: |
          # GitHub 上仅作参考（避免网络/规则同步导致误红）；
          # 真正阻断在贵司 GitLab CI 的 python-security 阶段。
          semgrep scan --config auto --severity ERROR --error --json -o semgrep-report.json src/ || true
