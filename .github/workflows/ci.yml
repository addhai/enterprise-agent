name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  python-test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests with coverage
        run: |
          # 全量跑 tests/ 目录。GitHub 公开仓库无 API Key、无 .env，
          # 所有需要真实 LLM / Embedding 的用例（标了 requires_llm marker）
          # 由 tests/conftest.py 在未设置 RUN_LLM_TESTS=1 时自动跳过，
          # 因此 CI 只执行确定性测试（FakeLLM / mock / 内存 SQLite），稳定且快速。
          #
          # 覆盖率门禁：实测 CI 裸环境覆盖率为 ~48%（828 passed / 17 skipped）。
          # 取 40 作为门槛，预留约 8 个点的环境波动余量（Ubuntu vs 本地 Windows
          # 的行数/平台分支差异），既不让覆盖率无声塌缩，又避免偶发波动把 CI 打红。
          pytest \
            tests/ \
            -v --cov=src --cov-report=term --cov-report=xml \
            -m "not integration" \
            --cov-fail-under=40 \
            -W "ignore::DeprecationWarning"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  python-security:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SAST tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep

      - name: Bandit (medium+, blocking)
        run: |
          # 中高危漏洞阻断合并；已知安全项已在 bandit.yaml 中说明
          bandit -c bandit.yaml -r src/ --severity-level medium -f txt

      - name: Semgrep (ERROR, advisory on GitHub)
        run: |
          # GitHub 上仅作参考（避免网络/规则同步导致误红）；
          # 真正阻断在贵司 GitLab CI 的 python-security 阶段。
          semgrep scan --config auto --severity ERROR --error --json -o semgrep-report.json src/ || true
