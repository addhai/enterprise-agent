name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  python-test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest-github-actions-annotate-failures：把失败用例输出为 GitHub
          # annotation（::error file=...,line=...）。annotation 通过公开的
          # checks API 即可匿名读取，而下载完整 job 日志需要仓库 admin 权限，
          # 因此这是让 CI 失败原因"对外可诊断"的关键一环。
          pip install pytest pytest-cov pytest-asyncio pytest-github-actions-annotate-failures

      - name: Run tests
        run: |
          # 全量跑 tests/ 目录。GitHub 公开仓库无 API Key、无 .env，
          # 所有需要真实 LLM / Embedding 的用例（标了 requires_llm marker）
          # 由 tests/conftest.py 在未设置 RUN_LLM_TESTS=1 时自动跳过，
          # 因此 CI 只执行确定性测试（FakeLLM / mock / 内存 SQLite），稳定且快速。
          #
          # 这一步只判定"测试是否通过"，覆盖率门禁拆到下一步。
          # 拆分理由：两类失败（用例挂 / 覆盖率塌）会落在不同 step 上，
          # 而 step 级别的成败通过公开 jobs API 就能读到，无需 admin 日志权限。
          # --cov-fail-under=0 用于覆盖 pyproject.toml addopts 中的 40，
          # 避免覆盖率在此步提前触发失败、掩盖真正的用例失败。
          pytest tests/ \
            -ra --tb=short \
            --cov=src --cov-report=term --cov-report=xml \
            -m "not integration" \
            --cov-fail-under=0 \
            -W "ignore::DeprecationWarning"

      - name: Coverage gate (>=40%)
        # always(): 即使上一步用例失败，也报告当前覆盖率，便于一次性看清全貌
        if: always()
        run: |
          # 覆盖率门禁：实测裸环境（无 Key、无 .env、requires_llm 自动跳过）
          # 覆盖率约 48%（828 passed / 17 skipped）。取 40 作为门槛，
          # 预留约 8 个点的环境波动余量（Ubuntu vs 本地 Windows 的行数差异），
          # 既不让覆盖率无声塌缩，又避免偶发波动把 CI 打红。
          coverage report --fail-under=40

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  python-security:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SAST tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep

      - name: Bandit (medium+, blocking)
        run: |
          # 中高危漏洞阻断合并；已知安全项已在 bandit.yaml 中说明
          bandit -c bandit.yaml -r src/ --severity-level medium -f txt

      - name: Semgrep (ERROR, advisory on GitHub)
        run: |
          # GitHub 上仅作参考（避免网络/规则同步导致误红）；
          # 真正阻断在贵司 GitLab CI 的 python-security 阶段。
          semgrep scan --config auto --severity ERROR --error --json -o semgrep-report.json src/ || true

  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        # 静态检查：.oxlintrc.json 已配规则；零配置项按默认，不阻塞正常告警
        run: npm run lint

      - name: Build (tsc -b + vite build)
        # 类型检查（tsc -b）是核心闸门：曾因 BotIcon 类型错误在本地修好、
        # 但 CI 只跑 Python 完全没拦到。vite build 产物输出到 ../static（已 gitignore）。
        run: npm run build

  infra-validate:
    name: Infra Validate (Compose + Images + Helm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose files
        run: |
          # 校验 4 个 compose 文件的语法、服务定义与变量插值。
          # 开发机上 Docker Desktop daemon 未必常开，但 `config` 只需 CLI，
          # 因此这一步能在任何 runner 上稳定拦住 compose 写崩的情况。
          for f in docker-compose.yml docker-compose.dev.yml \
                   docker-compose.milvus.yml docker-compose.monitoring.yml; do
            echo "--- validating $f ---"
            docker compose -f "$f" config --quiet
          done
          echo "services in docker-compose.yml:"
          docker compose -f docker-compose.yml config --services

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api image
        # 真构建（不 push），确保三个生产镜像的 Dockerfile 始终可用。
        # 此前这些 Dockerfile 从未在流水线中构建过，属于"代码齐全但没跑过"的盲区。
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          push: false
          tags: enterprise-agent-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker/Dockerfile
          push: false
          tags: enterprise-agent-worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - name: Build rag image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/rag/Dockerfile
          push: false
          tags: enterprise-agent-rag:ci
          cache-from: type=gha,scope=rag
          cache-to: type=gha,scope=rag,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Helm lint & template (default / staging / prod)
        run: |
          # lint 检查 chart 结构；template 对三套 values 分别做真实渲染。
          #
          # 必须三套都渲染：曾有 NOTES.txt 读取 .Values.apisix.service.httpPort，
          # 而默认 values 缺少 apisix.service 结构；因为默认/staging 的
          # apisix.enabled=false 被 if 短路，只有 prod（enabled=true）才会
          # 触发 nil pointer，导致 `helm install -f values-prod.yaml` 当场失败。
          # 单跑默认 values 完全拦不住这类"仅生产配置触发"的问题。
          helm lint deploy/helm/enterprise-agent
          for v in "" "values-staging.yaml" "values-prod.yaml"; do
            if [ -z "$v" ]; then
              echo "--- rendering with default values ---"
              helm template enterprise-agent deploy/helm/enterprise-agent > /tmp/rendered.yaml
            else
              echo "--- rendering with $v ---"
              helm template enterprise-agent deploy/helm/enterprise-agent \
                -f "deploy/helm/enterprise-agent/$v" > /tmp/rendered.yaml
            fi
            echo "  rendered $(grep -c '^kind:' /tmp/rendered.yaml) kubernetes resources"
          done
