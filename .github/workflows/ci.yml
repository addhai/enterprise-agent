name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  python-test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest-github-actions-annotate-failures：把失败用例输出为 GitHub
          # annotation（::error file=...,line=...）。annotation 通过公开的
          # checks API 即可匿名读取，而下载完整 job 日志需要仓库 admin 权限，
          # 因此这是让 CI 失败原因"对外可诊断"的关键一环。
          pip install pytest pytest-cov pytest-asyncio pytest-github-actions-annotate-failures

      - name: Run tests
        run: |
          # 全量跑 tests/ 目录。GitHub 公开仓库无 API Key、无 .env，
          # 所有需要真实 LLM / Embedding 的用例（标了 requires_llm marker）
          # 由 tests/conftest.py 在未设置 RUN_LLM_TESTS=1 时自动跳过，
          # 因此 CI 只执行确定性测试（FakeLLM / mock / 内存 SQLite），稳定且快速。
          #
          # 这一步只判定"测试是否通过"，覆盖率门禁拆到下一步。
          # 拆分理由：两类失败（用例挂 / 覆盖率塌）会落在不同 step 上，
          # 而 step 级别的成败通过公开 jobs API 就能读到，无需 admin 日志权限。
          # --cov-fail-under=0 用于覆盖 pyproject.toml addopts 中的 40，
          # 避免覆盖率在此步提前触发失败、掩盖真正的用例失败。
          pytest tests/ \
            -ra --tb=short \
            --cov=src --cov-report=term --cov-report=xml \
            -m "not integration" \
            --cov-fail-under=0 \
            -W "ignore::DeprecationWarning"

      - name: Coverage gate (>=40%)
        # always(): 即使上一步用例失败，也报告当前覆盖率，便于一次性看清全貌
        if: always()
        run: |
          # 覆盖率门禁：实测裸环境（无 Key、无 .env、requires_llm 自动跳过）
          # 覆盖率约 48%（828 passed / 17 skipped）。取 40 作为门槛，
          # 预留约 8 个点的环境波动余量（Ubuntu vs 本地 Windows 的行数差异），
          # 既不让覆盖率无声塌缩，又避免偶发波动把 CI 打红。
          coverage report --fail-under=40

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      # 临时诊断：把 CI 环境的真实 import / 路由状态写到公开可读的 ci-diag 分支，
      # 因为 job 完整日志需仓库 admin 权限、annotation API 匿名 404，无法直接读取。
      # 定位根因后会删除本 step。
      - name: Diagnose CI (publish to ci-diag branch)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "RUN_SHA: $GITHUB_SHA" | tee ci_diag.txt
          echo "PYTHON: $(python --version 2>&1)" | tee -a ci_diag.txt
          python -c "
          import traceback
          try:
              from src.api.auth import router
              print('AUTH_IMPORT: OK')
          except Exception as e:
              print('AUTH_IMPORT: FAIL')
              traceback.print_exc()
          " 2>&1 | tee -a ci_diag.txt
          python -c "
          import traceback
          try:
              from src.api.server import app
              paths = app.openapi()['paths']
              print('APP_ROUTES_TOTAL:', len(paths))
              print('AUTH_ROUTES:', [p for p in paths if '/auth' in p])
              print('REG_ERRORS:', getattr(app.state, 'router_registration_errors', 'N/A'))
          except Exception as e:
              print('SERVER_IMPORT: FAIL')
              traceback.print_exc()
          " 2>&1 | tee -a ci_diag.txt
          python -c "
          import importlib
          for m in ('bcrypt','pydantic','fastapi'):
              try:
                  mod = importlib.import_module(m)
                  print(m, getattr(mod,'__version__','?'))
              except Exception as e:
                  print(m, 'IMPORT FAIL', repr(e))
          " 2>&1 | tee -a ci_diag.txt
          git config user.email "ci@local"
          git config user.name "ci-diag"
          git add ci_diag.txt
          git commit -m "ci: publish diagnostics [skip ci]" || echo "nothing"
          git push origin HEAD:ci-diag || echo "push failed"

  python-security:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SAST tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep

      - name: Bandit (medium+, blocking)
        run: |
          # 中高危漏洞阻断合并；已知安全项已在 bandit.yaml 中说明
          bandit -c bandit.yaml -r src/ --severity-level medium -f txt

      - name: Semgrep (ERROR, advisory on GitHub)
        run: |
          # GitHub 上仅作参考（避免网络/规则同步导致误红）；
          # 真正阻断在贵司 GitLab CI 的 python-security 阶段。
          semgrep scan --config auto --severity ERROR --error --json -o semgrep-report.json src/ || true
