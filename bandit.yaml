# =============================================================================
# bandit.yaml — Enterprise Agent SAST 配置（门禁的"已知安全清单"单一真相）
#
# 资深开发把关原则：
#   - 任何 skip 必须带明确理由，禁止无理由静默抑制安全告警。
#   - 修改前请确认对应代码确为误报，或已通过其他方式（参数化/受信任输入）防护。
#   - CI 以 `--severity-level medium` 运行：仅 MEDIUM 及以上、且未被 skip 的
#     告警会触发失败并阻断合并；LOW 级告警作为观察项不阻断。
# =============================================================================

exclude_dirs:
  - tests            # 测试目录：断言/假实现非生产代码，不扫描
  - node_modules
  - venv
  - .venv
  - '*/migrations/*'

skips:
  # B104 绑定 0.0.0.0：
  # 本项目全部为容器化微服务（Docker/k8s），进程绑定 0.0.0.0 是预期行为；
  # 网络暴露由编排层（NetworkPolicy / Service 端口映射）收敛，非绑定地址决定。
  # 故全局跳过，避免对云原生部署产生系统性误报。
  - B104
