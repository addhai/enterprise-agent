# =============================================================================
# Prometheus 监控配置 — Enterprise Agent（单机 8 容器生产架构）
# =============================================================================
# 拓扑说明（2026-10-10 实测校准）：
#   生产为单机 8 容器，全部挂在 prod-net 桥接网络，Docker 内置 DNS 按容器名解析：
#     prod-app-1          业务 FastAPI（8000，metrics 端点 /api/v1/metrics/prometheus）
#     prod-postgres-1     PostgreSQL（5432）
#     prod-redis-1        Redis（6379）
#     agent-pg-exporter   postgres_exporter（9187，数据源 postgres:5432/agent）
#     agent-redis-exporter redis_exporter（9121，--redis.addr=redis:6379）
#     agent-prometheus / agent-grafana / agent-feishu-adapter
#   早期 K8s 时代的幽灵服务名（apisix/rag-service/ws-service/milvus/rabbitmq）
#   已随架构演进废弃，本文件已剔除，避免抓取目标全部 down。
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: agent-prod
    environment: production

# ---- Alertmanager（可选，暂不配置外部通知出口）----
# 生产暂无 Alertmanager 容器，告警仅在 Prometheus 内部 /alerts 页可见。
# 需要外部通知（webhook/邮件）时再接入，勿在无出口时硬开。
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

rule_files:
  - "alerts.yml"

scrape_configs:
  # ---- 自监控 ----
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ---- 业务应用（FastAPI）----
  # metrics 路径经实测为 /api/v1/metrics/prometheus（/metrics 返回 404）
  - job_name: app
    metrics_path: /api/v1/metrics/prometheus
    static_configs:
      - targets: ['prod-app-1:8000']
        labels:
          service: api

  # ---- PostgreSQL（postgres_exporter sidecar）----
  - job_name: postgres
    static_configs:
      - targets: ['agent-pg-exporter:9187']
        labels:
          service: postgres

  # ---- Redis（redis_exporter sidecar）----
  - job_name: redis
    static_configs:
      - targets: ['agent-redis-exporter:9121']
        labels:
          service: redis
