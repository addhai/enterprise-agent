# =============================================================================
# Prometheus 告警规则 — Enterprise Agent（单机 8 容器生产架构）
# =============================================================================
# 2026-10-10 校准：剔除 K8s 时代幽灵告警
#   - LLMCallFailures（llm_call_* 指标不存在，且描述残留"阿里百炼"已废弃）
#   - QueueBacklog（rabbitmq_queue_messages_ready，无 RabbitMQ）
#   - HighWSConnections（ws_active_connections，app 未暴露此指标）
#   - CircuitBreakerOpen（apisix_plugin_breaker_status，无 APISIX）
# 保留并校准为当前真实指标（app 端点实测暴露 http_requests_total、
#   http_request_duration_seconds、agent_offline_events_total 等 8 个指标）。
# =============================================================================

groups:
  - name: agent-service
    rules:
      # ---- 服务可用性 ----
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} 服务不可用"
          description: "{{ $labels.service }} 已超过 2 分钟无响应 (instance: {{ $labels.instance }})"

      # ---- API 延迟 ----
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{service="api"}[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API P95 延迟 > 2秒"
          description: "API 服务 P95 延迟 {{ $value }}s，可能存在问题"

      # ---- API 错误率 ----
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API 5xx 错误率 > 5%"
          description: "当前错误率 {{ $value | humanizePercentage }}"

      # ---- Agent 掉线事件 ----
      # agent_offline_events_total 为累计计数，用 increase 捕捉新增掉线。
      - alert: AgentOffline
        expr: increase(agent_offline_events_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "坐席 Agent 发生掉线"
          description: "过去 10 分钟新增 {{ $value }} 次 agent 掉线事件"

      # ---- Redis 内存使用 ----
      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis 内存使用 > 85%"
          description: "Redis 内存使用率 {{ $value | humanizePercentage }}"
