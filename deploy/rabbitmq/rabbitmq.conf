# RabbitMQ 配置
# 基础配置，生产环境需调优

# 监听端口
listeners.tcp.default = 5672

# Management UI
management.tcp.port = 15672
management.tcp.ip   = 0.0.0.0

# 内存高水位线
vm_memory_high_watermark.relative = 0.6

# 磁盘空闲空间限制 (50MB)
disk_free_limit.absolute = 50MB

# 日志级别
log.console.level = warning

# 注意: 不再使用 load_definitions 静态导入拓扑。
# RabbitMQ 4.x 在导入 definitions 时要求 vhost 已存在，而内建默认 vhost "/"
# 的创建时机与之冲突，会稳定报
#   BOOT FAILED: Please create virtual host "/" prior to importing definitions
# 改为由应用自身幂等声明拓扑 (src/broker/topology.py)，broker 自初始化更稳健，
# 也不再依赖 management 插件。definitions.json 仅作拓扑设计参考，已不再挂载加载。

# MQTT / STOMP 不需要，相关插件未启用，不可在 rabbitmq.conf 配置其键（RabbitMQ 4.x 严格 schema 校验会拒绝未启用插件的配置键）
