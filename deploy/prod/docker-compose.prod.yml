# =============================================================================
# Enterprise Agent - 生产环境 Docker Compose（单容器内嵌 Ollama）
# =============================================================================
# 架构说明（与 deploy/p2/ 独立部署套件的区别）：
#   本文件是**单容器**方案：Ollama 与 FastAPI 打进同一个镜像
#   （Dockerfile 的 runtime-with-ollama target），因此没有独立的 ollama 服务。
#   镜像 4.5GB（Phase5 性能基准从 14.7GB 优化而来）。
#
#   deploy/p2/ 是**多容器**方案：app / ollama / postgres / redis 各自独立，
#   资源限制更细、GPU 可单独分配，但需要更大显存的机器。
#
#   选型：显存 < 8GB 或单卡的机器用本文件；多卡/多节点用 deploy/p2/。
#
# 关键约束（全内网离线，勿改）：
#   - OPENAI_API_BASE 必须指向 http://127.0.0.1:11434/v1（容器内本地 Ollama）。
#     **不要**改成 https://dashscope.aliyuncs.com/... —— 那会让运行时依赖外网。
#   - LLM_MODEL / EMBEDDING_MODEL 必须是本地已拉取的模型名。
#   - no_proxy / NO_PROXY 必须包含容器内服务名，否则宿主代理会拦截容器内通信。
#
# 启动:  docker compose -f deploy/prod/docker-compose.prod.yml --env-file deploy/prod/.env.production up -d
# 停止:  docker compose -f deploy/prod/docker-compose.prod.yml --env-file deploy/prod/.env.production down
# 日志:  docker compose -f deploy/prod/docker-compose.prod.yml --env-file deploy/prod/.env.production logs -f app
#
# 一键部署: bash deploy/prod/scripts/deploy.sh
# 回滚:     bash deploy/prod/scripts/rollback.sh
# 验证:     bash deploy/prod/scripts/verify.sh
# =============================================================================

services:
  # =========================================================================
  # 业务容器（FastAPI + LangGraph + RAG + Ollama 全在一个镜像里）
  # =========================================================================
  app:
    image: enterprise-agent-app-ollama:latest
    build:
      context: ../..
      dockerfile: Dockerfile
      # runtime-with-ollama 这个 target 把 Ollama 二进制与模型目录一起打进镜像。
      # 改成别的 target 会得到一个没有 Ollama 的容器，LLM 调用会在运行时报
      # connection refused（表现为所有对话 500）。
      target: runtime-with-ollama
      # 构建期代理：只在 docker build 时用得上（拉 pip / 模型权重）。
      # 运行期不生效 —— 运行期走容器内直连。留空表示不用代理。
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTP_PROXY:-}
        http_proxy: ${BUILD_HTTP_PROXY:-}
        https_proxy: ${BUILD_HTTP_PROXY:-}
    restart: unless-stopped
    # 启动脚本（2026-10-05 外置，见 scripts/start-app.sh）：
    #   镜像自身 CMD 只启动 uvicorn，不会拉起 ollama。脚本负责挂接 WSL GPU 驱动、
    #   后台启动 ollama 并做就绪探针、最后前台 exec uvicorn。
    # 必须用脚本路径调用（不含任何 $），Docker Compose v5.5.1 的插值规则下，
    # 内联 shell 变量（$$）已无法被还原成字面 $，会导致 LD_LIBRARY_PATH 拼接损坏。
    command: ["/app/scripts/start-app.sh"]
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      # 运行环境：production 启用最严安全档（P0-6）。
      # 此时 JWT_SECRET 为空或仍是出厂占位值会直接拒启动（fail fast）。
      - ENVIRONMENT=${ENVIRONMENT:-production}
      # JWT_SECRET 必须显式注入。production 下缺失/占位会拒启动；
      # 历史上缺失时会退回弱密钥或一次性随机密钥，重建容器后 token 集体失效。
      - JWT_SECRET=${JWT_SECRET}
      # 出厂默认密码账号（admin/admin123 等）是否强制改密后才能访问业务
      # 接口与坐席 WS。默认开启；前端改密页未上线前可临时置 false 豁免，
      # 豁免必须登记并限期收敛（P0-6）。
      - REQUIRE_DEFAULT_PASSWORD_CHANGE=${REQUIRE_DEFAULT_PASSWORD_CHANGE:-true}
      # 登录爆破防护：同一用户名连续失败 N 次锁 M 分钟（默认 5 / 15）。
      - LOGIN_MAX_FAILURES=${LOGIN_MAX_FAILURES:-5}
      - LOGIN_LOCKOUT_MINUTES=${LOGIN_LOCKOUT_MINUTES:-15}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # ↓↓↓ 全内网离线的核心：下面三行必须指向容器内本地 Ollama
      - OPENAI_API_BASE=http://127.0.0.1:11434/v1
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:7b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-bge-m3}
      - VECTOR_STORE_BACKEND=chroma
      - CHROMA_PERSIST_DIR=/app/chroma_data
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - STORAGE_BACKEND=auto
      - REDIS_URL=redis://redis:6379
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
      # 单容器内 Ollama 与应用抢同一份内存/显存，串行执行避免 OOM。
      # 并发调高会让 CPU 推理场景直接被 OOM Killer 杀掉。
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      # 宿主若配了 HTTP_PROXY，容器内访问 postgres/redis 会被代理劫持。
      # 这两行让这些**容器内地址**绕过代理。缺了它健康检查会连不上 postgres。
      - no_proxy=127.0.0.1,localhost,ollama,host.docker.internal,postgres,redis
      - NO_PROXY=127.0.0.1,localhost,ollama,host.docker.internal,postgres,redis
      # 容器内是精简 Debian，缺这三项中文输出会变乱码并让部分库报编码错。
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
      - REWRITE_ENABLED=${REWRITE_ENABLED:-true}
      - DOC_WEIGHTS=${DOC_WEIGHTS}
      - RETRIEVAL_SOURCE_CAP=${RETRIEVAL_SOURCE_CAP:-2}
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-10485760}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - EVAL_LLM_JUDGE_ENABLED=false
      - EVAL_ONLINE_SAMPLING_RATE=0.0
      - AGENT_PROBE_ENABLED=${AGENT_PROBE_ENABLED}
      # Phase5 语义收口（2026-10-05 显式注入）：kb_call_mode 生产口径 always。
      # rerank 三项一并固化，不再依赖镜像内烤入的 .env（当时实测容器 env 0 处命中）。
      # 只写 .env.production 不注入这里是无效的，Phase4b 已踩过同类坑。
      - KB_CALL_MODE=${KB_CALL_MODE:-always}
      - RERANK_ENABLED=${RERANK_ENABLED:-true}
      - RERANK_PROVIDER=${RERANK_PROVIDER:-local_bge}
      - RERANK_MODEL=${RERANK_MODEL:-/app/models/bge-reranker-base}
    volumes:
      - agent_chroma:/app/chroma_data
      - agent_logs:/app/logs
      # Ollama 模型目录挂出来，避免每次重建镜像都重新拉 4GB 权重。
      - ollama_models:/home/appuser/.ollama
      - ../../data/docs:/app/data/docs:ro
    networks:
      - prod-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 注意路径是 /api/v1/health（带 v1），不是 /api/health。
      # 写成后者会 404，docker 会一直报 unhealthy 但容器其实活得很好——
      # Phase5 排查时为此浪费过时间，别改错。
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      # 首次启动要加载本地 bge-m3 + reranker 权重，冷启动慢。
      # 调回 30s 会在权重加载完成前就判失败，触发无意义的重启循环。
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          # 8G 是含 Ollama + 权重后的实测上限，别下调。
          memory: 8G
        reservations:
          cpus: '0.5'
          memory: 512M
          # GPU 请求必须挂在 reservations.devices 下（Compose 规范位置）。
          # 2026-10-05 修正：重建损坏文件时被错放到 resources.devices，
          # 新版 compose（v5.5.1）严格校验直接拒绝整个文件。
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # =========================================================================
  # PostgreSQL（业务结构化数据：租户、会话、审计、配置中心）
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-agent}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - prod-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  # =========================================================================
  # Redis（缓存 + 会话状态 + Agent 消息队列）
  # =========================================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 达到上限时淘汰最近最少使用的键（allkeys-lru）。
    # 不设策略会用 noeviction，写满后所有缓存写入直接报错。
    # 2026-10-05 教训：YAML 折叠块（>）内的 # 不是注释，会被折进命令行原样
    # 传给 redis-server，容器启动直接 FATAL CONFIG FILE ERROR。注释只能写在块外。
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - prod-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 384M

# =========================================================================
# 持久化卷（显式命名，避免 compose 项目名变化导致卷"丢失"）
# =========================================================================
volumes:
  agent_chroma:
    name: prod-agent-chroma
  agent_logs:
    name: prod-agent-logs
  pg_data:
    name: prod-pg-data
  redis_data:
    name: prod-redis-data
  ollama_models:
    name: prod-ollama-models

# =========================================================================
# 网络（内部隔离，只有 app 对外暴露 8000）
# =========================================================================
networks:
  prod-net:
    name: prod-net
    driver: bridge
