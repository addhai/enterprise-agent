# =============================================================================
# Enterprise Agent — 本地质量门禁（pre-commit）
# 目标：把 80% 的低级错（格式 / 未用导入 / 明显逻辑）挡在 push 之前，
#       让 CI 不再红在 lint 上，反馈回路从「分钟级 CI」缩短到「秒级本地」。
# 安装：pip install pre-commit && pre-commit install
# 跳过：git commit --no-verify   （仅在你确信时）
# =============================================================================

repos:
  # ---- ruff：lint + 格式化（自动修复）----
  # rev 对齐 requirements-dev.txt / pyproject 中 ruff>=0.9.0，避免本地与 CI 规则漂移
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ---- gitleaks：密钥扫描（commit 前拦截，与 CI A1 门禁双保险）----
  # 与上方 ruff 不同，这里用「本地预编译二进制」而非源码编译。
  # 原因（2026-09-30 实测）：源码编译需完整 Go 工具链，本机未安装且
  # 国际带宽受限（go.dev 下载 70MB 包超时）。改用官方 release 的 Windows
  # 预编译二进制，版本与 CI 完全一致（v8.18.4），功能等价。
  # 二进制位置：D:\Go\bin\gitleaks.exe（如需升级，替换该 exe 并同步改 rev 注释）
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)
        entry: D:/Go/bin/gitleaks.exe protect --staged --redact
        language: system
        pass_filenames: false

  # ---- 本地快测：仅在 push 前跑，不拖慢每次 commit ----
  # 跑「非集成 / 非 LLM」子集（与 CI 的 -m "not integration" 一致），
  # 真实 LLM / 云 AK 用例默认跳过（密钥红线：不进公网 CI，只在本机/受保护环境跑）。
  - repo: local
    hooks:
      - id: pytest-fast
        name: fast unit tests (pre-push)
        entry: pytest -q -m "not integration and not requires_llm"
        language: system
        pass_filenames: false
        stages: [pre-push]
